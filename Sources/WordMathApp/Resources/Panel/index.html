<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Word 数学输入</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="app.js"></script>
</head>
<body>
  <main id="panel">
    <div id="modeBar" class="mode-bar" hidden>
      <div class="mode-options" role="group" aria-label="输入方式">
        <button id="revisionMode" type="button" aria-pressed="true">继续修改</button>
        <button id="replaceMode" type="button" aria-pressed="false">重新描述</button>
      </div>
      <span id="scope">
        <span id="scopeLabel"></span>
        <button id="clearScope" class="icon" type="button" aria-label="取消选区" title="取消选区">×</button>
      </span>
    </div>
    <form id="promptForm">
      <input id="prompt" aria-label="自然语言描述" type="text" autocomplete="off" placeholder="描述符号、公式或推导…">
      <select id="model" aria-label="本次使用的模型" title="本次使用的模型"></select>
      <button type="button" class="icon settings" id="settings" aria-label="AI 服务设置" title="AI 服务设置">⚙</button>
      <button id="generate" type="submit" class="primary">生成</button>
    </form>
    <p id="planUsage" hidden>使用 ChatGPT 套餐 · <button id="manageUsage" type="button">查看用量</button></p>
    <p id="setupHint" hidden>连接 AI 服务后即可生成内容，也可以先<button type="button" id="example">试用排版示例</button>。</p>
    <p id="modelNotice" class="error" role="alert" hidden></p>
    <p id="status" role="status" aria-live="polite" hidden></p>
    <p id="receipt" role="status" aria-live="polite" hidden></p>
    <div id="repairBar" hidden>
      <button type="button" id="repair">修复排版</button>
      <span>将向同一模型再发送一次请求。</span>
    </div>
    <section id="previewArea" aria-label="待插入内容" hidden>
      <div id="preview" tabindex="0" aria-label="排版预览，点选文字或符号可编辑。左右方向键选择，回车编辑。"></div>
      <div id="editBar" hidden>
        <label for="editValue">编辑选中内容</label>
        <input id="editValue" type="text" autocomplete="off">
        <button id="applyEdit" type="button">应用</button>
        <button id="followSelection" type="button">针对选区追问</button>
      </div>
      <footer>
        <span id="previewHint">点选文字或符号可编辑</span>
        <button id="cancel" type="button">取消</button>
        <button id="insert" type="button" class="primary">插入 Word <kbd>⌘↵</kbd></button>
      </footer>
    </section>
  </main>
</body>
</html>
