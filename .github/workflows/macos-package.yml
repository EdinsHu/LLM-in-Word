name: Test and package WordMath for Mac

on:
  push:
    branches: [main]
    paths:
      - Packaging/Info.plist
      - .github/workflows/macos-package.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run Swift and WebKit tests
        run: |
          ./scripts/test.sh
          swift Tests/Panel/run.swift
      - name: Build and verify the Apple Silicon app
        run: |
          ./scripts/build-app.sh
          app=dist/WordMath.app
          lipo "$app/Contents/MacOS/WordMath" -verify_arch arm64
          codesign --verify --strict "$app"
          version="$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")"
          archive="dist/WordMath-${version}-macOS-arm64.zip"
          ditto -c -k --norsrc --noextattr --keepParent "$app" "$archive"
          unzip -tq "$archive"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: dist/WordMath-*-macOS-arm64.zip
          archive: false
          if-no-files-found: error
