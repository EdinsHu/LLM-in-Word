name: Test and package WordMath for Windows
on:
  push:
    branches: [main, windows-port]
    paths:
      - 'windows/**'
      - 'Sources/WordMathApp/Resources/Panel/**'
      - 'Sources/WordMathCore/Content.swift'
      - '.github/workflows/windows-package.yml'
  pull_request:
    paths:
      - 'windows/**'
      - 'Sources/WordMathApp/Resources/Panel/**'
      - 'Sources/WordMathCore/Content.swift'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify document engine
        run: dotnet run --project windows/WordMath.CoreChecks -c Release
      - name: Build the self-contained installer
        run: ./windows/Package.ps1
      - name: Install and test the distributed application
        run: ./windows/Test-Installation.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: dist/WordMath-*-windows-x64-setup.exe
          archive: false
          if-no-files-found: error
