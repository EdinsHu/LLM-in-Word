name: Publish tested WordMath candidate
on:
  push:
    branches: [windows-port, main]
    paths: [.github/windows-preview.json]
  workflow_dispatch:
permissions: {}
jobs:
  publish:
    if: github.ref == 'refs/heads/windows-port' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    concurrency: windows-release-preview
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Publish the installers that passed the platform tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-preview.sh
